<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KATABASI</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <div id="fog-canvas"></div>
    <div id="splash-content">
      <p class="splash-eyebrow">κατάβασις</p>
      <h1 class="splash-title">KATABASI</h1>
      <p class="splash-subtitle">Una discesa. Una verità. Nessun ritorno uguale.</p>
      <button id="splash-btn">Inizia la discesa</button>
    </div>
  </div>

  <!-- SFONDO SCENA -->
  <div id="scene-background"></div>

  <!-- WRAPPER PRINCIPALE -->
  <div id="game-wrapper" class="hidden">

    <!-- HEADER -->
    <header id="game-header">
      <span id="header-logo">KATABASI</span>
      <span id="header-identity"></span>
      <button id="inventory-toggle">Inventario</button>
    </header>

    <!-- AREA SCENA -->
    <main id="scene-main"></main>

    <!-- PANNELLO INVENTARIO -->
    <aside id="inventory-panel" class="hidden">
      <h2 class="inventory-title">Inventario</h2>
      <div id="inventory-items"></div>
      <div id="item-detail" class="hidden">
        <p class="detail-name"></p>
        <p class="detail-desc"></p>
      </div>
    </aside>

  </div>

  <!-- OVERLAY ENIGMA -->
  <div id="puzzle-overlay" class="overlay hidden">
    <div id="puzzle-content" class="overlay-box"></div>
  </div>

  <!-- OVERLAY DIALOGO -->
  <div id="dialogue-overlay" class="overlay hidden">
    <div id="dialogue-box" class="overlay-box dialogue-layout">
      <div id="dialogue-portrait-wrap">
        <img id="dialogue-portrait" src="" alt="">
      </div>
      <div id="dialogue-body">
        <p id="dialogue-name"></p>
        <p id="dialogue-text"></p>
        <div id="dialogue-options"></div>
      </div>
    </div>
  </div>

  <!-- OVERLAY BACHECA -->
  <div id="board-overlay" class="overlay hidden">
    <div id="board-canvas"></div>
  </div>

  <!-- MESSAGGIO FEEDBACK -->
  <div id="message-box" class="hidden"></div>

  <!-- SCRIPTS — ordine importante -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
   <!-- <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script> -->
  <script src="js/game.js"></script>
  <script src="js/data/scenes.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/characters.js"></script>
  <script src="js/data/puzzles.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/board.js"></script>
  <script src="js/ending.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
